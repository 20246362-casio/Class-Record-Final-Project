<div class="form-card">
  <h3>{{ editStudent ? 'Edit Student' : 'Add Student' }}</h3>
  <p class="form-sub">
    {{ editStudent ? 'Update this student\'s record in the ledger.' : 'Enter the student\'s details to add them to the class.' }}
  </p>

  <form (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <div class="field">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="name" name="name" placeholder="e.g. Juan Dela Cruz" required>
      </div>

      <div class="field">
        <label>Student ID</label>
        <input type="text" [(ngModel)]="studentId" name="studentId" placeholder="e.g. 2023-0215" required>
      </div>

      <div class="field">
        <label>Course</label>
        <select [(ngModel)]="course" name="course">
          <option value="APPDEV1">APPDEV1</option>
          <option value="APPDEV2">APPDEV2</option>
          <option value="DATASTRUC">DATASTRUC</option>
        </select>
      </div>

      <div class="field">
        <label>Grade</label>
        <input type="number" [(ngModel)]="grade" name="grade" placeholder="e.g. 90" required>
      </div>
    </div>

    <div class="form-actions">
      @if (editStudent) {
        <button type="button" class="btn btn-outline" (click)="cancelEdit()">Cancel</button>
      }
      <button type="submit" class="btn btn-primary">
        {{ editStudent ? 'Update Student' : 'Save Student' }}
      </button>
    </div>
  </form>
</div>
